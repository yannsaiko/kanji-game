<script>
        // ⭐ APIキー（内蔵またはローカルストレージ）
        const HARDCODED_API_KEY = "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";
        let apiKey = localStorage.getItem("groq_api_key") || HARDCODED_API_KEY;

        // ⭐ Web Audio API & BGMエンジン
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let soundVolume = 0.5;
        let bgmInterval = null;

        function updateVolume(val) {
            soundVolume = val / 100;
            document.getElementById("volume-val").innerText = val;
            playSound('click');
        }

        // BGMシーケンサー
        function startBGM() {
            stopBGM();
            let noteIndex = 0;
            const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
            bgmInterval = setInterval(() => {
                if (soundVolume <= 0) return;
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(melody[noteIndex], now);
                gain.gain.setValueAtTime(0.03 * soundVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);

                noteIndex = (noteIndex + 1) % melody.length;
            }, 300);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function playSound(type) {
            if (soundVolume <= 0) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            let baseVolume = 0.2 * soundVolume;

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(baseVolume, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'correct') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1);
                gain.gain.setValueAtTime(baseVolume * 1.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.setValueAtTime(110, now + 0.15);
                gain.gain.setValueAtTime(baseVolume * 1.5, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'boss') {
                osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(880, now + 0.2);
                gain.gain.setValueAtTime(baseVolume, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        // 起動時チェック
        window.onload = async () => {
            document.getElementById("api-key-input").value = apiKey;
            document.getElementById("volume-slider").value = soundVolume * 100;
            changeInputMode(inputMode);
            startBGM();
            checkApiAuthQuietly();
        };

        async function checkApiAuthQuietly() {
            const dot = document.getElementById("api-status-dot");
            const text = document.getElementById("ai-status-text");
            if (!apiKey) {
                dot.className = "status-dot dot-red";
                text.innerText = "APIキー未設定（内蔵データモード）";
                return;
            }
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                    body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: "test" }], max_tokens: 2 })
                });
                if (res.ok) {
                    dot.className = "status-dot dot-green";
                    text.innerText = "Groq AI接続完了（AI出題モード稼働中）";
                } else {
                    dot.className = "status-dot dot-red";
                    text.innerText = "APIキー無効（内蔵データモード）";
                }
            } catch (e) {
                dot.className = "status-dot dot-red";
                text.innerText = "通信エラー（内蔵データモード）";
            }
        }

        const fallbackDb = {
            "小学生": [
                { kanji: "川", reading: "かわ", category: "小学生", meaning: "水が自然に流れる水路。", isBoss: false },
                { kanji: "花", reading: "はな", category: "小学生", meaning: "植物の美しい部分。", isBoss: false },
                { kanji: "学校", reading: "がっこう", category: "小学生", meaning: "勉強を教え、学ぶ場所。", isBoss: false },
                { kanji: "太陽", reading: "たいよう", category: "小学生", meaning: "地球に光と熱を与える星。", isBoss: false },
                { kanji: "漢字", reading: "かんじ", category: "小学生【BOSS】", meaning: "古代中国で生まれた文字。", isBoss: true }
            ],
            "中学生": [
                { kanji: "挨拶", reading: "あいさつ", category: "中学生", meaning: "出会いや別れの際の礼儀的な言葉。", isBoss: false },
                { kanji: "笑顔", reading: "えがお", category: "中学生", meaning: "にこにこと笑った顔。", isBoss: false },
                { kanji: "複雑", reading: "ふくざつ", category: "中学生", meaning: "仕組みや事柄が絡み合っていて難しいこと。", isBoss: false },
                { kanji: "故郷", reading: "ふるさと", category: "中学生", meaning: "自分が生まれ育った土地。", isBoss: false },
                { kanji: "憂鬱", reading: "ゆううつ", category: "中学生【BOSS】", meaning: "気持ちがふさいで暗くなること。", isBoss: true }
            ],
            "高校生": [
                { kanji: "躊躇", reading: "ちゅうちょ", category: "高校生", meaning: "あれこれ迷って決心がつかないこと。", isBoss: false },
                { kanji: "矛盾", reading: "むじゅん", category: "高校生", meaning: "つじつまが合わないこと。", isBoss: false },
                { kanji: "隠蔽", reading: "いんぺい", category: "高校生", meaning: "都合の悪い事実を隠し覆うこと。", isBoss: false },
                { kanji: "明瞭", reading: "めいりょう", category: "高校生", meaning: "はっきりしていて見分けやすいこと。", isBoss: false },
                { kanji: "薔薇", reading: "ばら", category: "高校生【BOSS】", meaning: "トゲを持つ美しい花植物。", isBoss: true }
            ],
            "一般常識": [
                { kanji: "醤油", reading: "しょうゆ", category: "一般常識", meaning: "大豆などを発酵させて作る調味料。", isBoss: false },
                { kanji: "咀嚼", reading: "そしゃく", category: "一般常識", meaning: "食べ物をよく噛み砕いて味わうこと。", isBoss: false },
                { kanji: "流石", reading: "さすが", category: "一般常識", meaning: "評判どおり感心させられる様子。", isBoss: false },
                { kanji: "贔屓", reading: "ひいき", category: "一般常識", meaning: "自分の気に入った人を特に応援すること。", isBoss: false },
                { kanji: "胡椒", reading: "こしょう", category: "一般常識【BOSS】", meaning: "ピリッとした辛味のあるスパイス調味料。", isBoss: true }
            ],
            "漢字王": [
                { kanji: "心許ない", reading: "こころもとない", category: "漢字王", meaning: "頼りなくて不安である様子。", isBoss: false },
                { kanji: "暫く", reading: "しばらく", category: "漢字王", meaning: "少しの間の短い時間。", isBoss: false },
                { kanji: "穿つ", reading: "うがつ", category: "漢字王", meaning: "穴をあける。物事の本質を鋭く捉えること。", isBoss: false },
                { kanji: "喧噪", reading: "けんそう", category: "漢字王", meaning: "騒がしく、うるさいこと。", isBoss: false },
                { kanji: "魑魅魍魎", reading: "ちみもうりょう", category: "漢字王【FINAL BOSS】", meaning: "山林の精気から生じる様々なバケモノ妖怪の総称。", isBoss: true }
            ]
        };

        let currentList = [];
        let currentIndex = 0;
        let lives = 3;
        let timer = null;
        let timeRemaining = 30;
        let isPaused = false;
        let activeMode = "小学生";
        let inputMode = "keyboard";

        function changeInputMode(mode) {
            inputMode = mode;
            document.getElementById("settings-input-mode").value = mode;
            const customKey = document.getElementById("custom-keyboard");
            const flickBtn = document.getElementById("flick-submit-btn");
            const inputField = document.getElementById("user-input");
            
            if (inputMode === "flick") {
                customKey.classList.add("hidden");
                flickBtn.classList.remove("hidden");
                inputField.readOnly = false;
                inputField.placeholder = "ここをタップして入力";
            } else {
                customKey.classList.remove("hidden");
                flickBtn.classList.add("hidden");
                inputField.readOnly = true;
                inputField.placeholder = "ひらがなで入力";
            }
        }

        // ⭐ ゲーム開始・問題生成
        async function startGame(mode) {
            playSound('click');
            activeMode = mode;
            currentIndex = 0;
            lives = 3;
            
            document.getElementById("screen-title").classList.add("hidden");
            document.getElementById("screen-gameover").classList.add("hidden");
            document.getElementById("screen-clear").classList.add("hidden");
            document.getElementById("screen-loading").classList.remove("hidden");

            let loadedFromAi = false;

            if (apiKey) {
                try {
                    const prompt = `あなたは漢字ゲームの出題AIです。「${mode}」の難易度に適した漢字クイズを合計5問、JSON形式の配列のみで作成してください。\n【条件】\n- 5問を作成（idは1から5）。\n- 5問目はisBossをtrueにし、categoryの末尾に【BOSS】をつけてください。\n- readingは必ずひらがな。\n- meaningは分かりやすい解説文。\n- マークダウン（\`\`\`json など）は一切含めず純粋なJSON配列文字列のみを出力してください。\n[{"id":1,"kanji":"林檎","reading":"りんご","category":"${mode}","meaning":"赤い果実。","isBoss":false}]`;

                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [{ role: "user", content: prompt }],
                            temperature: 0.9
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        let jsonText = data.choices[0].message.content.trim();
                        
                        // マークダウン除去処理
                        if (jsonText.includes("```json")) {
                            jsonText = jsonText.split("```json")[1].split("```")[0].trim();
                        } else if (jsonText.includes("```")) {
                            jsonText = jsonText.split("```")[1].split("```")[0].trim();
                        }

                        currentList = JSON.parse(jsonText);
                        loadedFromAi = true;
                    }
                } catch (e) {
                    console.warn("AI出題に失敗したため、内蔵データを使用します:", e);
                }
            }

            if (!loadedFromAi) {
                currentList = fallbackDb[mode] || fallbackDb["小学生"];
            }

            document.getElementById("screen-loading").classList.add("hidden");
            document.getElementById("screen-game").classList.remove("hidden");
            loadStage();
        }

        // ⭐ ステージ読み込み
        function loadStage() {
            const q = currentList[currentIndex];
            document.getElementById("stage-text").innerText = `STAGE ${currentIndex + 1} / ${currentList.length}`;
            document.getElementById("category-text").innerText = `【${q.category}】`;
            document.getElementById("kanji-display").innerText = q.kanji;
            document.getElementById("user-input").value = "";
            updateLivesDisplay();

            const bossBadge = document.getElementById("boss-badge");
            const enemyEmoji = document.getElementById("enemy-emoji");

            if (q.isBoss) {
                bossBadge.classList.remove("hidden");
                enemyEmoji.innerText = "👹";
                document.getElementById("ai-message").innerText = "AI「ボス登場！心して挑め！」";
                playSound('boss');
            } else {
                bossBadge.classList.add("hidden");
                enemyEmoji.innerText = "👾";
                document.getElementById("ai-message").innerText = "AI「この漢字の読みをひらがなで答えよ！」";
            }

            startTimer();
        }

        // ⭐ タイマー処理（30秒カウントダウン & タイムアップ判定）
        function startTimer() {
            stopTimer();
            timeRemaining = 30;
            document.getElementById("timer-text").innerText = timeRemaining;

            timer = setInterval(() => {
                if (isPaused) return;

                timeRemaining--;
                document.getElementById("timer-text").innerText = timeRemaining;

                if (timeRemaining <= 0) {
                    handleTimeUp();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        // ⭐ タイムアップ時の処理
        function handleTimeUp() {
            stopTimer();
            playSound('wrong');
            lives--;
            updateLivesDisplay();

            const box = document.getElementById("enemy-box");
            box.classList.add("shake");
            setTimeout(() => box.classList.remove("shake"), 300);

            if (lives <= 0) {
                // ライフ尽きてゲームオーバー
                document.getElementById("screen-game").classList.add("hidden");
                document.getElementById("screen-gameover").classList.remove("hidden");
                document.getElementById("gameover-stats").innerText = 
                    `時間切れ！STAGE ${currentIndex + 1}「${currentList[currentIndex].kanji}」で全滅しました...`;
            } else {
                // ライフ減小後にタイマーを再始動して継続
                document.getElementById("ai-message").innerText = `AI「タイムアップ！ 残りライフ: ${lives}」`;
                document.getElementById("user-input").value = "";
                startTimer();
            }
        }

        function updateLivesDisplay() {
            document.getElementById("lives-container").innerText = "❤️".repeat(Math.max(0, lives));
        }

        // ⭐ 画面キーボード入力補助
        function addKey(char) {
            playSound('click');
            const input = document.getElementById("user-input");
            input.value += char;
        }

        function delKey() {
            playSound('click');
            const input = document.getElementById("user-input");
            input.value = input.value.slice(0, -1);
        }

        function addDakuten() {
            playSound('click');
            const input = document.getElementById("user-input");
            if (!input.value) return;
            const last = input.value.slice(-1);
            const dakutenMap = {
                'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご',
                'さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ',
                'た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど',
                'は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'
            };
            if (dakutenMap[last]) {
                input.value = input.value.slice(0, -1) + dakutenMap[last];
            }
        }

        function addHandakuten() {
            playSound('click');
            const input = document.getElementById("user-input");
            if (!input.value) return;
            const last = input.value.slice(-1);
            const handakutenMap = { 'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ' };
            if (handakutenMap[last]) {
                input.value = input.value.slice(0, -1) + handakutenMap[last];
            }
        }

        // ⭐ 解答送信判定
        function submitAnswer() {
            const input = document.getElementById("user-input");
            const userAns = input.value.trim();
            if (!userAns) return;

            const q = currentList[currentIndex];

            if (userAns === q.reading) {
                // 正解
                stopTimer();
                playSound('correct');
                showExplanationModal(q);
            } else {
                // 不正解（ペナルティ & リセット）
                playSound('wrong');
                const box = document.getElementById("enemy-box");
                box.classList.add("shake");
                setTimeout(() => box.classList.remove("shake"), 300);
                document.getElementById("ai-message").innerText = "AI「ブッブー！不正解！」";
                input.value = "";
            }
        }

        // ⭐ 正解解説モーダル表示
        function showExplanationModal(q) {
            document.getElementById("modal-title").innerText = q.isBoss ? "🔥 BOSS撃破！" : "🎉 正解！";
            document.getElementById("modal-kanji").innerText = q.kanji;
            document.getElementById("modal-reading").innerText = `【${q.reading}】`;
            document.getElementById("modal-meaning").innerText = q.meaning;
            document.getElementById("modal-explanation").classList.remove("hidden");
        }

        // ⭐ 次のステージへ進む
        function nextStage() {
            playSound('click');
            document.getElementById("modal-explanation").classList.add("hidden");
            currentIndex++;

            if (currentIndex >= currentList.length) {
                // 全ステージクリア
                document.getElementById("screen-game").classList.add("hidden");
                document.getElementById("screen-clear").classList.remove("hidden");
            } else {
                loadStage();
            }
        }

        // ⭐ 設定モーダル制御
        function openSettings() {
            playSound('click');
            isPaused = true;
            document.getElementById("modal-settings").classList.remove("hidden");
        }

        function saveSettings() {
            playSound('click');
            apiKey = document.getElementById("api-key-input").value.trim();
            localStorage.setItem("groq_api_key", apiKey);
            document.getElementById("modal-settings").classList.add("hidden");
            isPaused = false;
            checkApiAuthQuietly();
        }

        // ⭐ タイトルメニューに戻る
        function goToTitle() {
            playSound('click');
            stopTimer();
            document.getElementById("screen-gameover").classList.add("hidden");
            document.getElementById("screen-clear").classList.add("hidden");
            document.getElementById("screen-game").classList.add("hidden");
            document.getElementById("screen-title").classList.remove("hidden");
        }
    </script>
